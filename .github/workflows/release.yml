name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag names the version every package carries
        run: |
          for package in server client; do
            version=$(node -p "require('./packages/$package/package.json').version")
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "packages/$package is $version, and the tag says $GITHUB_REF_NAME"
              exit 1
            }
          done

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:consumer

      - run: npm publish --workspace quoin-collab-server --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace quoin-collab-client --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
